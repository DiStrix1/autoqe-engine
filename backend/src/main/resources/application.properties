# =============================================================================
# QE Agent Backend Orchestrator - Application Properties
# =============================================================================
# All database credentials and host addresses are read from this file.
# NO hardcoded secrets in source code (PROJECT_SPECIFICATION.md Rule 1.2).
# =============================================================================

# -----------------------------------------------------------------------------
# Server
# -----------------------------------------------------------------------------
server.port=8080
spring.application.name=qe-agent-backend

# -----------------------------------------------------------------------------
# Spring JPA / PostgreSQL (pgvector store for code embeddings)
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/code_vectors
spring.datasource.username=dev_user
spring.datasource.password=dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Note: spring-boot-starter-jdbc (JdbcTemplate) is used — NOT spring-boot-starter-data-jpa.
# JPA/Hibernate is NOT on the classpath, so no spring.jpa.* properties are needed here.

# -----------------------------------------------------------------------------
# Neo4j Graph Database
# -----------------------------------------------------------------------------
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=dev_password

# -----------------------------------------------------------------------------
# LangChain4j - Ollama Chat Model
#
# numCtx=8192 is REQUIRED by PROJECT_SPECIFICATION.md Section 6.2 to prevent
# stack-trace truncation during self-healing prompts.
# -----------------------------------------------------------------------------
langchain4j.ollama.chat-model.base-url=http://localhost:11434
langchain4j.ollama.chat-model.model-name=llama3:8b
langchain4j.ollama.chat-model.temperature=0.0
langchain4j.ollama.chat-model.timeout=300s
langchain4j.ollama.chat-model.log-requests=true
langchain4j.ollama.chat-model.log-responses=true
# Context window: 8 192 tokens mandatory per PROJECT_SPECIFICATION.md Section 6.2
langchain4j.ollama.chat-model.num-ctx=8192
# Custom options header (spec Section 6.2 verbatim)
langchain4j.ollama.chat-model.custom-headers.num_ctx=8192

# -----------------------------------------------------------------------------
# Spring Boot Actuator
# -----------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging.level.com.qe.agent=DEBUG
logging.level.dev.langchain4j=INFO
logging.level.org.springframework.web=INFO

# -----------------------------------------------------------------------------
# Embedding Model (Improvement #N)
# Controls dimension validation in VectorQueryTool and startup log in OllamaConfig.
# If you swap to a different embedding model, update this value AND the Python
# parser-service EMBEDDING_DIM environment variable to match.
# -----------------------------------------------------------------------------
qe.embedding.expected-dimensions=384

# -----------------------------------------------------------------------------
# Test Sandbox & Runner Security (Safety Guardrails)
# -----------------------------------------------------------------------------
qe.runner.maven-timeout-seconds=120
# Set this to the absolute path of the Maven project that tests are executed in.
# Any targetFilePath submitted to the API must resolve inside this root.
# Leave blank only for local development (weakens security — see README).
qe.sandbox.allowed-root=D:/Projects/qe-rag-system/test-sandbox

# -----------------------------------------------------------------------------
# Workspace Path Translation
#
# The Python parser service runs in Docker and stores file paths using the
# container-internal prefix (e.g. /workspace/test-sandbox/src/...).  Spring Boot
# runs on the Windows host and cannot resolve those Linux paths directly.
#
# Set qe.workspace.container-prefix to the prefix used inside the container and
# qe.workspace.host-root to the real Windows directory it maps to.
# The orchestrator and /file-content endpoint use these to translate paths before
# any Files.exists() / Files.readString() call.
#
# Example:
#   container path : /workspace/test-sandbox/src/main/java/com/qe/demo/Main.java
#   translated to  : D:/Projects/qe-rag-system/test-sandbox/src/main/java/com/qe/demo/Main.java
# -----------------------------------------------------------------------------
qe.workspace.container-prefix=/workspace
# Left blank so WorkspacePathTranslator automatically derives the project root portably
qe.workspace.host-root=

# -----------------------------------------------------------------------------
# CORS — Production: set qe.cors.allowed-origins to your real domain(s)
# Example: https://autoqe.example.com,https://www.autoqe.example.com
# Default: localhost frontends for local development only
# -----------------------------------------------------------------------------
qe.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:4173

# -----------------------------------------------------------------------------
# Security — API Key Authentication
# Set qe.security.enabled=true in production and provide at least one strong key.
# Generate a key with: openssl rand -hex 32
# NEVER commit real key values — inject via environment variable:
#   QE_SECURITY_API_KEYS=<your-secret-key>
# -----------------------------------------------------------------------------
qe.security.enabled=${QE_SECURITY_ENABLED:false}
qe.security.api-keys=${QE_SECURITY_API_KEYS:}

# -----------------------------------------------------------------------------
# Rate Limiting (Bucket4j) — generation endpoints only
# 5 requests per IP per minute by default.
# trust-forwarded-for: set true ONLY when behind a verified reverse proxy.
# -----------------------------------------------------------------------------
qe.ratelimit.capacity=5
qe.ratelimit.refill-tokens=5
qe.ratelimit.refill-minutes=1
qe.ratelimit.trust-forwarded-for=${QE_RATELIMIT_TRUST_FORWARDED_FOR:false}

# -----------------------------------------------------------------------------
# Async Execution Pool
# -----------------------------------------------------------------------------
qe.async.core-pool-size=2
qe.async.max-pool-size=4
qe.async.queue-capacity=10

# -----------------------------------------------------------------------------
# Observability & Distributed Tracing (Micrometer + OpenTelemetry)
# -----------------------------------------------------------------------------
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

