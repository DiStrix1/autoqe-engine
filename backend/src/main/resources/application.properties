# =============================================================================
# QE Agent Backend Orchestrator - Application Properties
# =============================================================================
# All database credentials and host addresses are read from this file.
# NO hardcoded secrets in source code (PROJECT_SPECIFICATION.md Rule 1.2).
# =============================================================================

# -----------------------------------------------------------------------------
# Server
# -----------------------------------------------------------------------------
server.port=8080
spring.application.name=qe-agent-backend

# -----------------------------------------------------------------------------
# Spring JPA / PostgreSQL (pgvector store for code embeddings)
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/code_vectors
spring.datasource.username=dev_user
spring.datasource.password=dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Note: spring-boot-starter-jdbc (JdbcTemplate) is used — NOT spring-boot-starter-data-jpa.
# JPA/Hibernate is NOT on the classpath, so no spring.jpa.* properties are needed here.

# -----------------------------------------------------------------------------
# Neo4j Graph Database
# -----------------------------------------------------------------------------
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=dev_password

# -----------------------------------------------------------------------------
# LangChain4j - Ollama Chat Model
#
# numCtx=8192 is REQUIRED by PROJECT_SPECIFICATION.md Section 6.2 to prevent
# stack-trace truncation during self-healing prompts.
# -----------------------------------------------------------------------------
langchain4j.ollama.chat-model.base-url=http://localhost:11434
langchain4j.ollama.chat-model.model-name=llama3:8b
langchain4j.ollama.chat-model.temperature=0.0
langchain4j.ollama.chat-model.timeout=300s
langchain4j.ollama.chat-model.log-requests=true
langchain4j.ollama.chat-model.log-responses=true
# Context window: 8 192 tokens mandatory per PROJECT_SPECIFICATION.md Section 6.2
langchain4j.ollama.chat-model.num-ctx=8192
# Custom options header (spec Section 6.2 verbatim)
langchain4j.ollama.chat-model.custom-headers.num_ctx=8192

# -----------------------------------------------------------------------------
# Spring Boot Actuator
# -----------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging.level.com.qe.agent=DEBUG
logging.level.dev.langchain4j=INFO
logging.level.org.springframework.web=INFO

# -----------------------------------------------------------------------------
# Embedding Model (Improvement #N)
# Controls dimension validation in VectorQueryTool and startup log in OllamaConfig.
# If you swap to a different embedding model, update this value AND the Python
# parser-service EMBEDDING_DIM environment variable to match.
# -----------------------------------------------------------------------------
qe.embedding.expected-dimensions=384
