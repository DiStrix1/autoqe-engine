server {
    listen 80;
    server_name _;

    # ---------------------------------------------------------------------------
    # Redirect all HTTP → HTTPS in production
    # ---------------------------------------------------------------------------
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name autoqe.example.com;  # Replace with your domain

    # ---------------------------------------------------------------------------
    # TLS — replace with your real certificate paths or Let's Encrypt managed certs
    # ---------------------------------------------------------------------------
    ssl_certificate     /etc/ssl/certs/autoqe.crt;
    ssl_certificate_key /etc/ssl/private/autoqe.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ---------------------------------------------------------------------------
    # Security Headers
    # ---------------------------------------------------------------------------

    # Force HTTPS for 1 year; include subdomains
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Prevent MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Deny framing from any origin (clickjacking protection)
    add_header X-Frame-Options "DENY" always;

    # Enable XSS filter in older browsers
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer policy — send only origin on cross-origin requests
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions policy — disable unused browser APIs
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # Content Security Policy — restrict resource origins
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://autoqe.example.com wss://autoqe.example.com; frame-ancestors 'none'; form-action 'self';" always;

    # ---------------------------------------------------------------------------
    # Static Frontend — serve Vite dist/
    # ---------------------------------------------------------------------------
    root /var/www/autoqe/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        # Cache static hashed assets aggressively
        location ~* \.(js|css|woff2?|png|svg|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ---------------------------------------------------------------------------
    # Reverse Proxy — Spring Boot API (:8080)
    # ---------------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-API-Key $http_x_api_key;
        # SSE streams need buffering disabled
        proxy_buffering    off;
        proxy_read_timeout 900s;
    }

    # ---------------------------------------------------------------------------
    # Reverse Proxy — WebSocket STOMP Stream (:8080)
    # ---------------------------------------------------------------------------
    location ~* ^/(ws|ws-native) {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-API-Key $http_x_api_key;
        proxy_read_timeout 900s;
    }

    # ---------------------------------------------------------------------------
    # Reverse Proxy — Python Parser Service (:8000)
    # ---------------------------------------------------------------------------
    location /parser/ {
        rewrite ^/parser/(.*) /$1 break;
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-API-Key $http_x_api_key;
    }

    # ---------------------------------------------------------------------------
    # Health check path (no auth required for load balancer probes)
    # ---------------------------------------------------------------------------
    location = /health {
        proxy_pass http://127.0.0.1:8080/api/v1/health;
        access_log off;
    }
}
