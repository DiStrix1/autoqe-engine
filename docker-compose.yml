version: '3.8'

networks:
  qe_network:
    driver: bridge

services:
  pgvector-db:
    image: pgvector/pgvector:pg16
    container_name: qe_pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: code_vectors
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    networks:
      - qe_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d code_vectors"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  neo4j-db:
    image: neo4j:5-community
    container_name: qe_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/dev_password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: 'apoc.*'
    ports:
      - "7474:7474"   # HTTP Web Console
      - "7687:7687"   # Bolt Protocol Port
    volumes:
      - neo4j_data:/data
    networks:
      - qe_network
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p dev_password 'RETURN 1;'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  parser-service:
    build:
      context: ./parser-service
      dockerfile: Dockerfile
    container_name: qe_parser_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Neo4j credentials — must match neo4j-db service above
      NEO4J_URI: bolt://neo4j-db:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: dev_password
      # PostgreSQL credentials — must match pgvector-db service above
      PG_HOST: pgvector-db
      PG_PORT: 5432
      PG_DB: code_vectors
      PG_USER: dev_user
      PG_PASSWORD: dev_password
    networks:
      - qe_network
    depends_on:
      pgvector-db:
        condition: service_healthy
      neo4j-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pgvector_data:
  neo4j_data: