version: '3.8'

# =============================================================================
# ENVIRONMENT VARIABLES
# Create a .env file in the project root (never commit it) with real values:
#
#   POSTGRES_PASSWORD=<strong-random-password>
#   NEO4J_PASSWORD=<strong-random-password>
#   GRAFANA_ADMIN_PASSWORD=<strong-random-password>
#   QE_SECURITY_API_KEYS=<openssl-rand-hex-32>
#   QE_CORS_ALLOWED_ORIGINS=https://autoqe.example.com
#
# For local development, copy .env.example to .env — the defaults work as-is.
# For production, inject secrets from your secrets manager into these env vars.
# =============================================================================

networks:
  qe_network:
    driver: bridge

services:
  pgvector-db:
    image: pgvector/pgvector:pg16
    container_name: qe_pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: code_vectors
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD is required. Set it in .env}
    # Production: remove or change port binding to 127.0.0.1 only when behind a reverse proxy
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    networks:
      - qe_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d code_vectors"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  neo4j-db:
    image: neo4j:5-community
    container_name: qe_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Error: NEO4J_PASSWORD is required. Set it in .env}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: 'apoc.coll.*,apoc.map.*,apoc.text.*'
    ports:
      - "127.0.0.1:7474:7474"   # HTTP Web Console
      - "127.0.0.1:7687:7687"   # Bolt Protocol Port
    volumes:
      - neo4j_data:/data
    networks:
      - qe_network
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:?Error: NEO4J_PASSWORD is required. Set it in .env} 'RETURN 1;'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  parser-service:
    build:
      context: ./parser-service
      dockerfile: Dockerfile
    container_name: qe_parser_service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j-db:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Error: NEO4J_PASSWORD is required. Set it in .env}
      PG_HOST: pgvector-db
      PG_PORT: 5432
      PG_DB: code_vectors
      PG_USER: dev_user
      PG_PASSWORD: ${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD is required. Set it in .env}
      WORKSPACE_ROOT: /workspace
      QE_SECURITY_ENABLED: ${QE_SECURITY_ENABLED:-false}
      QE_SECURITY_API_KEYS: ${QE_SECURITY_API_KEYS:-}
    volumes:
      - ./test-sandbox:/workspace/test-sandbox:ro
    networks:
      - qe_network
    depends_on:
      pgvector-db:
        condition: service_healthy
      neo4j-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    container_name: qe_ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - qe_network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Observability Stack
  # ---------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:latest
    container_name: qe_prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      # Retain 15 days of data in production; reduce for constrained environments
      - '--storage.tsdb.retention.time=15d'
    networks:
      - qe_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    container_name: qe_grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Production: set GRAFANA_ADMIN_PASSWORD env var to a strong secret
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Error: GRAFANA_ADMIN_PASSWORD is required. Set it in .env}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/autoqe.json
      # Disable anonymous access in production
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Prevent Grafana from phoning home
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - qe_network
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgvector_data:
  neo4j_data:
  ollama_data:
  prometheus_data:
  grafana_data: