name: CI / Build & Test Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-orchestrator:
    name: Backend (Spring Boot 3.x)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x backend/mvnw

      - name: Compile & Run Unit / Mock Tests
        working-directory: backend
        run: ./mvnw test-compile test --no-transfer-progress

  test-sandbox:
    name: Test Sandbox (Target Project & JaCoCo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x test-sandbox/mvnw

      - name: Compile & Run Sandbox Test Suite
        working-directory: test-sandbox
        run: ./mvnw test jacoco:report --no-transfer-progress

  frontend-studio:
    name: Frontend Studio (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify TypeScript & Build Production Bundle
        working-directory: frontend
        run: npm run build

  parser-service:
    name: Parser Service (Python / Tree-Sitter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: parser-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r parser-service/requirements.txt

      - name: Syntax & Compilation Check
        run: |
          python -m py_compile parser-service/main.py
          python -m py_compile parser-service/parser/*.py
